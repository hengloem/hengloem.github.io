<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-a">
  <title id="title-a">ech-angular icon</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#DD0031"></stop>
      <stop offset="1" stop-color="#C30028"></stop>
    </linearGradient>
  </defs>

  <!-- hexagon background -->
  <g transform="translate(32,32)">
    <path d="M0,-28 L24,-14 L24,14 L0,28 L-24,14 L-24,-14 Z" fill="url(#g1)"></path>
  </g>

  <!-- stylized A -->
  <g transform="translate(32,22)">
    <path d="M-10,8 L0,-12 L10,8 L6,8 L0,0 L-6,8 Z" fill="#fff"></path>
    <!-- crossbar -->
    <rect x="-6" y="0" width="12" height="2" rx="1" fill="#fff"></rect>
  </g>

  <!-- echo waves (right side) -->
  <g transform="translate(44,24)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M0,-6 C6,-6 10,-2 10,0" stroke-opacity="0.85"></path>
    <path d="M0,0 C8,0 14,6 14,8" stroke-opacity="0.55"></path>
  </g>
</svg>
